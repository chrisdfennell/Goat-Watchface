name: Release

# Builds side-loadable .prg files and publishes them to a GitHub Release
# whenever you push a version tag, e.g.:
#
#     git tag v1.2.0
#     git push origin v1.2.0
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Repository secret  GARMIN_DEVELOPER_KEY
#   Settings → Secrets and variables → Actions → Secrets → New repository secret.
#   Base64-encode your developer key and paste the result:
#     Windows : [Convert]::ToBase64String([IO.File]::ReadAllBytes("developer_key.der")) | Set-Clipboard
#     Linux   : base64 -w0 developer_key.der
#
# ── About the store .iq ───────────────────────────────────────────────────────
# This workflow deliberately does NOT build the store package. The .iq covers
# every product in manifest.xml, and the newest Connect IQ container image
# available (SDK 9.1.0) does not recognise the newest watches the manifest
# targets — fr70, fr170, fr170m and d2mach2pro — so the export fails outright.
# Garmin ships device definitions through the SDK Manager rather than in the SDK
# download, so CI cannot simply fetch a newer SDK either.
#
# So: build the .iq locally with a current SDK and attach it to the release.
#
#     .\release_local.ps1
#     gh release upload v1.2.0 release\GoatFace.iq
#
# When a container image with SDK 9.2.0 or later appears, restore the export
# step here and drop the local dance.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # lets you exercise the build without cutting a tag

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blackshadev/garmin-connectiq-tools:9.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Decode developer key
        run: |
          if [ -z "${{ secrets.GARMIN_DEVELOPER_KEY }}" ]; then
            echo "Error: GARMIN_DEVELOPER_KEY secret is not set!" >&2
            exit 1
          fi
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > developer_key.der

      - name: Build side-loadable .prg files
        run: |
          mkdir -p bin

          # One per distinct panel size the face targets. Every id here is known
          # to the SDK in the container image above; if you add a newer watch,
          # check it builds before adding it to this list.
          #   fenix847mm       AMOLED 454 (fenix/tactix/quatix 8 47mm AND 51mm)
          #   fenix843mm       AMOLED 416 (fenix 8 43mm)
          #   fr165            AMOLED 390 (Forerunner 165)
          #   fr265s           AMOLED 360 (Forerunner 265S)
          #   fenix8solar51mm  MIP 280 (tactix/fenix 8 Solar 51mm)
          #   fenix8solar47mm  MIP 260 (fenix 8 Solar 47mm)
          #   fenix7s          MIP 240 (fenix 7S)
          #   fr255s           MIP 218 (Forerunner 255S)
          #   fr965            AMOLED 454 (Forerunner 965)
          for device in fenix847mm fenix843mm fr165 fr265s fenix8solar51mm fenix8solar47mm fenix7s fr255s fr965; do
            echo "Compiling .prg for $device..."
            java -jar /connectiq/bin/monkeybrains.jar \
              -f monkey.jungle \
              -y developer_key.der \
              -o "bin/GoatFace_${device}.prg" \
              -d "$device"
          done
          ls -la bin/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Goat Face ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/GoatFace_*.prg
