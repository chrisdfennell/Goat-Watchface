name: Release

# Builds the store package and side-loadable .prg files, and publishes them to a GitHub Release
# whenever you push a version tag, e.g.:
#
#     git tag v1.2.0
#     git push origin v1.2.0
#
# ── One-time setup ────────────────────────────────────────────────────────────
# Repository secret  GARMIN_DEVELOPER_KEY
#   Settings → Secrets and variables → Actions → Secrets → New repository secret.
#   Base64-encode your developer key and paste the result:
#     Windows : [Convert]::ToBase64String([IO.File]::ReadAllBytes("developer_key.der")) | Set-Clipboard
#     Linux   : base64 -w0 developer_key.der
#
# ── About the store .iq ───────────────────────────────────────────────────────
# The .iq covers every product in manifest.xml, so it needs an SDK that knows
# all of them. The newest published Connect IQ container image ships SDK 9.1.0,
# which does not recognise the newest watches this manifest targets (fr70,
# fr170, fr170m, d2mach2pro). Garmin distributes device definitions through the
# SDK Manager rather than in the SDK download — they are not in the SDK zip —
# so CI cannot fetch a newer one by itself.
#
# Rather than fail, the build below strips exactly the products the SDK names
# and produces GoatFace-PARTIAL-missing-<ids>.iq. That name is deliberately
# ugly: a partial package must never be mistaken for the full one on its way to
# the Connect IQ store. Submit the full .iq built locally instead:
#
#     .\release_local.ps1
#     gh release upload v1.2.0 release\GoatFace.iq --clobber
#
# The moment an image with a newer SDK appears, bump the tag below and this goes
# back to producing a plain, complete GoatFace.iq with no intervention.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:          # lets you exercise the build without cutting a tag

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blackshadev/garmin-connectiq-tools:9.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Decode developer key
        run: |
          if [ -z "${{ secrets.GARMIN_DEVELOPER_KEY }}" ]; then
            echo "Error: GARMIN_DEVELOPER_KEY secret is not set!" >&2
            exit 1
          fi
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > developer_key.der

      - name: Build store package (.iq)
        run: |
          mkdir -p bin

          # The .iq covers every product in manifest.xml. The SDK in the image
          # above may not recognise the very newest watches, in which case the
          # export fails outright rather than skipping them. When that happens,
          # strip exactly the products it named and build again - and say so in
          # the artifact's name, so a partial package can never be mistaken for
          # the full one on the way to the store.
          set +e
          java -jar /connectiq/bin/monkeybrains.jar \
            -e -f monkey.jungle -y developer_key.der -o bin/GoatFace.iq 2>&1 | tee iq.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "Full store package built - every product in the manifest."
            exit 0
          fi

          if ! grep -q "are not recognized" iq.log; then
            echo "::error::.iq export failed for a reason other than unknown devices"
            cat iq.log
            exit 1
          fi

          ids=$(grep "are not recognized" iq.log | grep -o "'[A-Za-z0-9_]*'" | tr -d "'" | sort -u)
          echo "::warning::SDK in this image does not know: $(echo $ids | tr '\n' ' ')- building a partial package without them"

          cp manifest.xml manifest.full.xml
          for d in $ids; do
            sed -i "\#<iq:product id=\"$d\"/>#d" manifest.xml
          done

          java -jar /connectiq/bin/monkeybrains.jar \
            -e -f monkey.jungle -y developer_key.der \
            -o "bin/GoatFace-PARTIAL-missing-$(echo $ids | tr ' ' '-').iq"

          mv manifest.full.xml manifest.xml
          echo "PARTIAL=1" >> "$GITHUB_ENV"

      - name: Build side-loadable .prg files
        run: |
          mkdir -p bin

          # One per distinct panel size the face targets. Every id here is known
          # to the SDK in the container image above; if you add a newer watch,
          # check it builds before adding it to this list.
          #   fenix847mm       AMOLED 454 (fenix/tactix/quatix 8 47mm AND 51mm)
          #   fenix843mm       AMOLED 416 (fenix 8 43mm)
          #   fr165            AMOLED 390 (Forerunner 165)
          #   fr265s           AMOLED 360 (Forerunner 265S)
          #   fenix8solar51mm  MIP 280 (tactix/fenix 8 Solar 51mm)
          #   fenix8solar47mm  MIP 260 (fenix 8 Solar 47mm)
          #   fenix7s          MIP 240 (fenix 7S)
          #   fr255s           MIP 218 (Forerunner 255S)
          #   fr965            AMOLED 454 (Forerunner 965)
          for device in fenix847mm fenix843mm fr165 fr265s fenix8solar51mm fenix8solar47mm fenix7s fr255s fr965; do
            echo "Compiling .prg for $device..."
            java -jar /connectiq/bin/monkeybrains.jar \
              -f monkey.jungle \
              -y developer_key.der \
              -o "bin/GoatFace_${device}.prg" \
              -d "$device"
          done
          ls -la bin/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Goat Face ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/*.iq
            bin/GoatFace_*.prg
